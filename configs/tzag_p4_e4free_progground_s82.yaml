# Phase 4d control (2026-11-12) on E4 with free program tokens (program_tokens: all_code), seed 82, 4 epochs: program-level-grounding control: same descriptions, but step/unit descriptions target the approach token (hierarchy.ground: program).
# Compare with runs/p4/e4_allcode_s82. Free program tokens are an alternative, not the default E4. See the plan.
backbone:
  name: Qwen/Qwen2.5-Coder-0.5B
  cache_dir: /mnt/storage/users/glifshitz/code-jepa/models/hf
  local_files_only: true
  lora: false
  dtype: bf16
  grad_checkpointing: true
  attn_implementation: eager
hierarchy:
  node_levels: [step, unit, approach, intent]
  node_encoding: tree_mask
  step_depth: 2
  max_nodes: 96
  max_row_tokens: 2048
  program_tokens: all_code
  ground: program
predictor:
  tokens_per_level: 1
  level_specific: true
objectives:
  lm:
    weight: 1.0
    prompt: [intent, approach]
  view:
    weight: 0.5
    distance: cosine
    stop_grad: none
    direction: text_to_code
    levels: [step, unit, approach, intent]
  chain: false
  masked_nodes:
    enabled: false
    levels: [step, unit]
    target: no_detach
  cross_solution: false
  sigreg:
    weight: 0.3
    num_proj: 1024
    knots: 17
    bank_size: 32
    side: both
    level_weights: {step: 0.1, unit: 0.1, approach: 0.3, intent: 0.3}
  jepa_dropout: 0.5
projection_head:
  dim: 256
  layers: 2
train:
  lr_backbone: 1.0e-5
  lr_new_params: 5.0e-5
  epochs: 4
  batch_size: 8
  grad_accum: 1
  seed: 82
  output_dir: /mnt/storage/users/glifshitz/code-jepa/runs/p4/e4free_progground_s82
  log_every: 10
  eval_every: 100
  save_every: 4000
  num_workers: 0
  max_grad_norm: 1.0
data:
  jsonl: /mnt/storage/initzan/hjepa_code/hierarchy/full/code_contests.jsonl
  split: train
  eval_split: val
  max_samples: null
  eval_max_samples: null
